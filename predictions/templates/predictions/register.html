{% extends "predictions/base.html" %}

{% block title %}Register — Matchday Pro{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Create Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-green">Register</button>
    </form>
    <div class="auth-switch">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
    </div>
</div>
{% endblock %}
